---
layout: default
title: Blog
permalink: /blog/
---

<h1>Blog</h1>
<ul class="post-list">
  {% for post in site.categories.Blog %}
    <li>
      <a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a>
      <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
    </li>
  {% endfor %}
</ul>
