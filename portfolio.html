---
layout: default
title: Portfolio
permalink: /portfolio/
---

<h1>Portfolio</h1>
<ul class="post-list">
  {% for post in site.categories.Portfolio %}
    <li>
      <a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a>
      <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
    </li>
  {% endfor %}
</ul>
